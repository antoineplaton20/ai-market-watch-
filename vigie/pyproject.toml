[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigie"
version = "0.1.0"
description = "Détection et suivi de drones dans un flux vidéo, pour l'alerte précoce."
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "opencv-python-headless", "torch", "torchvision"]

[project.scripts]
vigie = "vigie.__main__:main"

[tool.setuptools]
packages = ["vigie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
