name: AI Market Bots v2

on:
  schedule:
    - cron: "2-59/5 4-21 * * *"   # toutes les 5 min de 6h à minuit (heure de Paris), 7 j/7 (crypto le week-end)
  workflow_dispatch:
    inputs:
      mode:
        description: "test / scan / force / matin / preus / recap"
        default: "test"

permissions:
  contents: write

concurrency:
  group: ai-bots
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Restaurer la mémoire du bot
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            cache_d1.pkl
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          [ -z "$LLM_BASE_URL" ] && unset LLM_BASE_URL
          [ -z "$LLM_MODEL" ] && unset LLM_MODEL
          case "${{ github.event.inputs.mode }}" in
            test)  python bot.py --test ;;
            force) python bot.py --force ;;
            matin) python bot.py --matin ;;
            preus) python bot.py --preus ;;
            recap) python bot.py --recap ;;
            *)     python bot.py ;;
          esac

      - name: Sauvegarder la mémoire du bot
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            cache_d1.pkl
          key: etat-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archiver le bilan hebdo (garde aussi le dépôt actif)
        if: always()
        run: |
          if [ -d bilans ]; then
            git config user.name "ai-bots"
            git config user.email "ai-bots@users.noreply.github.com"
            git add bilans
            git diff --cached --quiet || (git commit -m "Bilan hebdo [skip ci]" && git push)
          fi
